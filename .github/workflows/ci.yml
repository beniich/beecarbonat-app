name: CI — Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Backend – suffisent pour prisma generate (pas de vraie DB)
  DATABASE_URL: 'file:./ci.db'
  JWT_SECRET: 'ci-jwt-secret'
  PORT: '5001'

jobs:
  # ─── JOB 1 : Build Frontend (Vite) ────────────────────────────────────────
  build-frontend:
    name: Build — Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (bun)
        run: bun install

      - name: Vite build
        run: bun run build --filter=frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5001/api' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'http://localhost:5001' }}

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── JOB 2 : Prisma generate + backend sanity check ───────────────────────
  build-backend:
    name: Build — Backend (Prisma generate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (bun)
        run: bun install

      - name: Prisma generate
        run: bunx prisma generate
        working-directory: backend

      - name: Check server.js syntax
        run: node --check src/server.js
        working-directory: backend

  # ─── JOB 3 : Lint (optional, continue-on-error) ───────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: ESLint — frontend
        run: bun run lint --if-present
        working-directory: frontend
        continue-on-error: true
