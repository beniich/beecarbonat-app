<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spiderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Spiderweb backdrop -->
  <g stroke="#1e293b" stroke-width="3" fill="none" opacity="0.7">
    <line x1="256" y1="256" x2="256" y2="20"/>
    <line x1="256" y1="256" x2="430" y2="80"/>
    <line x1="256" y1="256" x2="492" y2="256"/>
    <line x1="256" y1="256" x2="430" y2="432"/>
    <line x1="256" y1="256" x2="256" y2="492"/>
    <line x1="256" y1="256" x2="82" y2="432"/>
    <line x1="256" y1="256" x2="20" y2="256"/>
    <line x1="256" y1="256" x2="82" y2="80"/>
    <polygon points="256,116 380,150 416,256 380,362 256,400 132,362 96,256 132,150"/>
    <polygon points="256,190 322,212 344,256 322,300 256,322 190,300 168,256 190,212"/>
  </g>

  <!-- Legs -->
  <g stroke="url(#spiderGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M222,222 L140,180 L70,114 L40,40"/>
    <path d="M214,250 L120,242 L40,262 L16,328"/>
    <path d="M214,278 L130,308 L70,378 L60,452"/>
    <path d="M228,298 L176,348 L150,420 L150,494"/>
    <path d="M290,222 L372,180 L442,114 L472,40"/>
    <path d="M298,250 L392,242 L472,262 L496,328"/>
    <path d="M298,278 L382,308 L442,378 L452,452"/>
    <path d="M284,298 L336,348 L362,420 L362,494"/>
  </g>

  <!-- Leg joints -->
  <g fill="#0e7490">
    <circle cx="140" cy="180" r="8"/>
    <circle cx="120" cy="242" r="8"/>
    <circle cx="130" cy="308" r="8"/>
    <circle cx="176" cy="348" r="8"/>
    <circle cx="372" cy="180" r="8"/>
    <circle cx="392" cy="242" r="8"/>
    <circle cx="382" cy="308" r="8"/>
    <circle cx="336" cy="348" r="8"/>
  </g>

  <!-- Abdomen -->
  <polygon points="256,260 320,330 256,494 192,330" fill="url(#spiderGrad)"/>
  <polygon points="256,260 320,330 256,494 192,330" fill="none" stroke="#0e7490" stroke-width="4"/>
  <polygon points="256,260 256,494 192,330" fill="#0e7490" opacity="0.4"/>

  <!-- Head -->
  <polygon points="256,150 300,220 256,272 212,220" fill="#06b6d4"/>
  <polygon points="256,150 300,220 256,272 212,220" fill="none" stroke="#0e7490" stroke-width="4"/>

  <!-- Eyes (glowing) -->
  <g fill="#0f172a">
    <circle cx="240" cy="206" r="6"/>
    <circle cx="272" cy="206" r="6"/>
    <circle cx="250" cy="226" r="4"/>
    <circle cx="262" cy="226" r="4"/>
  </g>

  <!-- Text "CAFM" -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="36" font-weight="bold" fill="#06b6d4" opacity="0.8">CAFM</text>
</svg>
