  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up old manual service workers to avoid conflicts with the new Workbox service-worker.js
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            const scriptURL = registration.active?.scriptURL || '';
            if (scriptURL && !scriptURL.endsWith('/service-worker.js')) {
              console.log('[PWA] Unregistering conflicting legacy service worker:', scriptURL);
              registration.unregister();
            }
          }
        });
      }
    </script>
  </body>
