version: '3.8'

services:
  # ============== BASE DE DONNÉES ==============
  postgres:
    image: postgres:16-alpine
    container_name: cafm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafm_user
      POSTGRES_PASSWORD: cafm_password
      POSTGRES_DB: cafm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafm_user -d cafm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== REDIS (cache) ==============
  redis:
    image: redis:7-alpine
    container_name: cafm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============== BACKEND API ==============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://cafm_user:cafm_password@postgres:5432/cafm_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      RESEND_API_KEY: ${RESEND_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
